name: MCURewatch
options:
  bundleIdPrefix: com.mikel.mcurewatch
  deploymentTarget:
    iOS: "17.0"
targets:
  MCURewatch:
    type: application
    platform: iOS
    sources:
      - path: Models
      - path: Views
      - path: ViewModels
      - path: Data
      - path: Persistence
      - path: Components
      - path: Services
      - path: MCURewatchApp.swift
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: MCU Rewatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikel.mcurewatch
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
